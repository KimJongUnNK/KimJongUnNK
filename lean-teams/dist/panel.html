<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Lean Teams Overlay</title>
<style>
  :root { color-scheme: dark; --bg: #0e0e10; --card: #17171a; --line: #232328; --text: #f2f2f2;
    --muted: #8a8a90; --lime: #c4ff00; --accent: #c4ff00; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif; -webkit-user-select: none; user-select: none; overflow: hidden; }
  body { display: flex; flex-direction: column; border: 1px solid #2a2a2e; border-radius: 12px; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; -webkit-app-region: drag; app-region: drag; }
  header .title { font-weight: 900; font-size: 17px; letter-spacing: -0.3px; flex: 1; }
  header .title span { color: var(--lime); }
  header button { -webkit-app-region: no-drag; app-region: no-drag; }
  .x { width: 26px; height: 26px; border-radius: 7px; border: 0; background: transparent; color: var(--muted);
    font-size: 16px; cursor: pointer; transition: background .15s, color .15s; }
  .x:hover { background: #232328; color: var(--text); }
  main { flex: 1; overflow-y: auto; padding: 0 16px 16px; animation: in .22s ease-out; scrollbar-width: thin; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  h3 { font-size: 10px; text-transform: uppercase; letter-spacing: 1.3px; color: var(--muted); margin: 16px 0 8px; font-weight: 800; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .row > label { flex: 1; cursor: pointer; }
  .hint { color: var(--muted); font-size: 11px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 7px; padding: 6px 0 10px; }
  .sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0;
    transition: transform .15s ease, border-color .15s ease; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
  .sw:hover { transform: scale(1.12); }
  .sw.on { border-color: #fff; transform: scale(1.12); }
  .sw.off { background: conic-gradient(#5b5fc7 0 50%, #2a2a2e 0); }
  .sw.custom { position: relative; overflow: hidden; background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red); }
  .sw.custom input { position: absolute; inset: -6px; opacity: 0; cursor: pointer; }
  input[type=checkbox] { appearance: none; -webkit-appearance: none; width: 36px; height: 21px; border-radius: 11px; background: #2a2a2e;
    position: relative; cursor: pointer; flex: none; margin: 0; transition: background .2s ease; }
  input[type=checkbox]::after { content: ""; position: absolute; top: 3px; left: 3px; width: 15px; height: 15px; border-radius: 50%;
    background: var(--muted); transition: transform .2s cubic-bezier(.3,.7,.4,1.3), background .2s ease; }
  input[type=checkbox]:checked { background: var(--accent); }
  input[type=checkbox]:checked::after { transform: translateX(15px); background: var(--bg); }
  input[type=range] { width: 150px; accent-color: var(--accent); }
  .val { min-width: 42px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .badge { font-size: 9px; font-weight: 800; padding: 2px 5px; border-radius: 4px; background: #2a2a2e; color: var(--lime); margin-left: 6px; }
  textarea { width: 100%; min-height: 150px; resize: vertical; background: var(--card); color: #e8e8e8; border: 1px solid #2a2a2e;
    border-radius: 9px; padding: 9px; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; outline: none;
    transition: border-color .15s; -webkit-user-select: text; user-select: text; }
  textarea:focus { border-color: var(--accent); }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn { border: 0; border-radius: 8px; padding: 8px 12px; font-weight: 700; font-size: 12px; cursor: pointer;
    background: #232328; color: var(--text); transition: background .15s, transform .1s; }
  .btn:hover { background: #2e2e34; }
  .btn:active { transform: scale(.97); }
  footer { padding: 8px 16px 12px; font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); transition: background .2s; }
  .dot.saved { background: var(--lime); }
  .dot.err { background: #ff6b6b; }
  .empty { color: var(--muted); font-size: 12px; padding: 6px 0; }
</style>
</head>
<body>
<header>
  <div class="title">Lean Teams <span>Overlay</span></div>
  <button class="x" id="close" title="Schließen (Esc)">✕</button>
</header>
<main id="main"></main>
<footer><span class="dot" id="dot"></span><span id="status">Änderungen wirken sofort und werden automatisch gespeichert.</span></footer>
<script src="panel.js"></script>
</body>
</html>
