name: teams-probe
on:
  push:
    branches: [claude/nifty-ptolemy-d2ami7]
    paths: [.github/workflows/teams-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for u in \
            "https://statics.teams.cdn.office.net/evergreen-assets/apps/66aeee93-507d-479a-a3ef-8f494af43945_largeImage.png" \
            "https://statics.teams.cdn.office.net/evergreen-assets/apps/66aeee93-507d-479a-a3ef-8f494af43945_smallImage.png" \
            "https://statics.teams.cdn.office.net/evergreen-assets/apps/0d820ecd-def2-4297-adad-78056cde7c78_largeImage.png" \
            "https://res-1.cdn.office.net/files/fabric-cdn-prod_20240129.001/assets/brand-icons/product/svg/teams_48x1.svg" \
            "https://teams.public.onecdn.static.microsoft/hashedassets-launcher/favicon/favicon-96x96-2025.png" \
            "https://statics.teams.cdn.office.net/evergreen-assets/icons/microsoft_teams_logo_refresh.ico" \
            ; do
            echo "=== $u"
            curl -sS -m 20 -o /dev/null -D - -H "Origin: https://teams.microsoft.com" "$u" | grep -iE '^(HTTP|access-control|content-type|content-length)' || true
          done
