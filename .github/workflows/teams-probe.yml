name: teams-probe
on:
  push:
    branches: [claude/nifty-ptolemy-d2ami7]
    paths: [.github/workflows/teams-probe.yml]
permissions:
  actions: read
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: screenshot-*
          run-id: 43014854957
          github-token: ${{ github.token }}
          path: shots
      - run: |
          pip install --quiet pillow
          python3 - <<'PY'
          import base64, io, glob
          from PIL import Image
          for f in sorted(glob.glob("shots/**/*.png", recursive=True)):
              im = Image.open(f).convert("RGB")
              w, h = im.size
              print("FILE", f, w, h)
              red = [(x, y) for x in range(0, w, 2) for y in range(0, h, 2) if (lambda p: p[0] > 200 and p[1] < 90 and p[2] < 90)(im.getpixel((x, y)))]
              print("RED_PIXELS", len(red), "bbox", (min(p[0] for p in red), min(p[1] for p in red), max(p[0] for p in red), max(p[1] for p in red)) if red else None)
              small = im.resize((w * 900 // w, h * 900 // w))
              buf = io.BytesIO(); small.save(buf, "PNG", optimize=True)
              b = base64.b64encode(buf.getvalue()).decode()
              print("B64BEGIN", f)
              for i in range(0, len(b), 2000): print("B64:" + b[i:i+2000])
              print("B64END")
          PY
