name: Flüster (macOS)

on:
  push:
    paths:
      - "fluester/**"
      - ".github/workflows/fluester-macos.yml"
  pull_request:
    paths:
      - "fluester/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Testen und App bauen
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fluester
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Tests (FluesterCore)
        run: swift test

      - name: App bauen
        run: VERSION="1.0.${{ github.run_number }}" BUILD="${{ github.run_number }}" ./scripts/build-app.sh

      - name: Bundle prüfen
        run: |
          plutil -lint "build/Flüster.app/Contents/Info.plist"
          file "build/Flüster.app/Contents/MacOS/Fluester"
          ls -la "build/Flüster.app/Contents/Resources"

      - uses: actions/upload-artifact@v4
        with:
          name: Fluester-macOS
          path: fluester/build/Fluester-macOS.zip
          if-no-files-found: error
          retention-days: 30
