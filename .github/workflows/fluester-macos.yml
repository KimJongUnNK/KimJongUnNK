name: Flüster (macOS)

on:
  push:
    paths:
      - "fluester/**"
      - ".github/workflows/fluester-macos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Testen und App bauen
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fluester
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Tests (FluesterCore)
        run: swift test

      - name: App bauen
        run: VERSION="1.0.${{ github.run_number }}" BUILD="${{ github.run_number }}" ./scripts/build-app.sh

      - name: Bundle prüfen
        run: |
          plutil -lint "build/Flüster.app/Contents/Info.plist"
          file "build/Flüster.app/Contents/MacOS/Fluester"
          ls -la "build/Flüster.app/Contents/Resources"

      - name: whisper.cpp für den Selbsttest
        run: |
          brew install whisper-cpp
          ls -1 "$(brew --prefix)/bin" | grep -i whisper
          MODELS="$HOME/Library/Application Support/Fluester/models"
          mkdir -p "$MODELS"
          curl -sSL --retry 3 -o "$MODELS/ggml-base.bin" https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
          ls -la "$MODELS"

      - name: Selbsttest (echte Spracherkennung mit say + Whisper + Apple)
        timeout-minutes: 15
        run: |
          FLUESTER_SELFTEST_WHISPER=base "build/Flüster.app/Contents/MacOS/Fluester" --selftest || {
            echo "--- whisper-server.log ---"
            cat "$HOME/Library/Application Support/Fluester/whisper-server.log" || true
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Fluester-macOS
          path: fluester/build/Fluester-macOS.zip
          if-no-files-found: error
          retention-days: 30
