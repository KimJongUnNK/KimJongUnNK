name: Lean Teams

on:
  push:
    paths: ["lean-teams/**", ".github/workflows/lean-teams.yml"]
  pull_request:
    paths: ["lean-teams/**", ".github/workflows/lean-teams.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: lean-teams

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lean-teams/src-tauri
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: cargo fmt --check
        working-directory: lean-teams/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: lean-teams/src-tauri
      - run: cargo test
        working-directory: lean-teams/src-tauri

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: ubuntu-24.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lean-teams/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Check measure.ps1 syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/measure.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
      - name: Build
        run: npx --yes @tauri-apps/cli@2.12.4 build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: lean-teams-${{ runner.os }}
          if-no-files-found: error
          path: |
            lean-teams/src-tauri/target/**/release/bundle/nsis/*.exe
            lean-teams/src-tauri/target/**/release/bundle/msi/*.msi
            lean-teams/src-tauri/target/**/release/bundle/dmg/*.dmg
            lean-teams/src-tauri/target/**/release/bundle/deb/*.deb
            lean-teams/src-tauri/target/**/release/bundle/appimage/*.AppImage
